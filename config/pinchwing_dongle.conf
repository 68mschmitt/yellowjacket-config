# Match Pinchwing's timing, pointing, and macro settings.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_IDLE_TIMEOUT=3000000
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_MAX_SLOTS=25
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_MAX_EVENTS=64
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_TAP_DELAY=20
