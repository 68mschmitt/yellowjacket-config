    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main

  dynamic-macro-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run dynamic macro host tests
        run: make test-dm
