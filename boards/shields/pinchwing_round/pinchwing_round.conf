CONFIG_SPI=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=50
CONFIG_LV_COLOR_DEPTH_16=y
# Panel SPI pixels are high-byte first; the nRF52840 is little-endian.
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
# 10% RGB565 rendering buffer: 11,520 bytes rather than a full 115,200 bytes.
CONFIG_LV_Z_VDB_SIZE=10
# UI objects plus one at-most-24-KB decoded sprite tile.
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_ZMK_WPM=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
